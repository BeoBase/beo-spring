# application-test.properties
# In-memory H2 database so full-context tests do not consume connections
# from the shared production PostgreSQL server during `mvn verify`.

# H2 in PostgreSQL compatibility mode (Hibernate generates the schema from entities)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Generate schema from JPA entities for the test run
spring.jpa.hibernate.ddl-auto=create-drop

# Keep the in-memory pool small
spring.datasource.hikari.maximum-pool-size=2

# JWT secret required by JwtTokenServiceImpl (safe test-only value)
jwt.secret=test-secret-test-secret-test-secret-test-secret
